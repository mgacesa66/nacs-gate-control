[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nacs-gate-control"
version = "0.1.0"
description = "Reproducible theoretical NaCs spectroscopy and complete-gate control benchmarks"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "sympy>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: numerical full-basis or 15-state checks"]
